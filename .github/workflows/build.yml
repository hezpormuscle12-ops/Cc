name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - name: Tim thu muc project
        id: p
        run: |
          f=$(find . -name settings.gradle | head -1)
          if [ -z "$f" ]; then echo "KHONG THAY settings.gradle trong repo"; ls -R | head -50; exit 1; fi
          echo "dir=$(dirname "$f")" >> $GITHUB_OUTPUT
      - name: Build
        working-directory: ${{ steps.p.outputs.dir }}
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MeoGoPhim-apk
          path: ${{ steps.p.outputs.dir }}/app/build/outputs/apk/debug/*.apk
